name: Build and Publish Maven Package

on:
  push:
    branches: [ main ]
  # Optional: deploy on new version tags
  # tags:
  #   - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK 17 and enable Maven cache
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3️⃣ Build the project JAR
      - name: Build JAR
        run: mvn clean package -DskipTests

      # 4️⃣ Deploy to GitHub Packages
      - name: Publish to GitHub Packages
        run: mvn deploy -s .github/settings.xml -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
